<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gasolinera IA</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      background: #111;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .result {
      margin-top: 25px;
    }

    .station {
      background: white;
      padding: 18px;
      margin-top: 12px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .price {
      font-size: 25px;
      font-weight: bold;
    }

    .name {
      font-size: 18px;
      font-weight: bold;
      margin-top: 6px;
    }

    .info {
      color: #666;
      margin-top: 6px;
    }

    .map {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
      background: #eee;
      color: #222;
      padding: 9px 12px;
      border-radius: 8px;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>⛽ Gasolinera IA</h1>

  <p class="subtitle">
    Encuentra el combustible más barato cerca de ti
  </p>

  <div class="card">

    <label for="postal">Código postal</label>

    <input
      id="postal"
      type="text"
      inputmode="numeric"
      placeholder="Ejemplo: 35010"
      maxlength="5"
    >

    <label for="fuel">Combustible</label>

    <select id="fuel">
      <option value="95">Gasolina 95</option>
      <option value="98">Gasolina 98</option>
      <option value="diesel">Diésel</option>
    </select>

    <label for="radius">Radio de búsqueda</label>

    <select id="radius">
      <option value="5">5 km</option>
      <option value="10">10 km</option>
      <option value="20">20 km</option>
    </select>

    <button id="searchButton" onclick="buscar()">
      🔎 Buscar gasolina barata
    </button>

  </div>

  <div id="result" class="result"></div>

</div>

<script>

async function buscar() {

  const postal = document
    .getElementById("postal")
    .value
    .trim();

  const fuel = document
    .getElementById("fuel")
    .value;

  const button =
    document.getElementById("searchButton");

  const result =
    document.getElementById("result");

  /*
   * Comprobamos el código postal
   */

  if (!/^\d{5}$/.test(postal)) {

    result.innerHTML = `
      <div class="station error">
        ⚠️ Introduce un código postal válido.
      </div>
    `;

    return;
  }

  /*
   * Desactivamos el botón mientras buscamos
   */

  button.disabled = true;

  result.innerHTML = `
    <div class="station loading">
      ⏳ Buscando gasolineras...
    </div>
  `;

  try {

    /*
     * Pedimos los datos a nuestra API
     */

    const response =
      await fetch("/api/gasolineras");

    if (!response.ok) {
      throw new Error(
        "No se pudieron obtener los datos"
      );
    }

    /*
     * La API devuelve:
     * {
     *   fecha: ...,
     *   estaciones: [...]
     * }
     */

    const datos =
      await response.json();

    const estaciones =
      datos.estaciones || [];

    /*
     * Elegimos el campo de precio
     */

    let campoPrecio = "";

    if (fuel === "95") {
      campoPrecio = "Precio Gasolina 95 E5";
    }

    if (fuel === "98") {
      campoPrecio = "Precio Gasolina 98 E5";
    }

    if (fuel === "diesel") {
      campoPrecio = "Precio Gasoleo A";
    }

    /*
     * Filtramos por código postal
     */

    const resultados = estaciones

      .filter(estacion => {

        return String(
          estacion["C.P."]
        ).trim() === postal;

      })

      .map(estacion => {

        const precioTexto =
          estacion[campoPrecio];

        if (!precioTexto) {
          return null;
        }

        const precio =
          parseFloat(
            String(precioTexto)
              .replace(",", ".")
          );

        if (isNaN(precio)) {
          return null;
        }

        return {

          nombre:
            estacion["Rótulo"] ||
            "Gasolinera",

          direccion:
            estacion["Dirección"] || "",

          localidad:
            estacion["Localidad"] || "",

          precio: precio,

          lat:
            estacion["Latitud"] || "",

          lon:
            estacion[
              "Longitud (WGS84)"
            ] || ""

        };

      })

      .filter(Boolean)

      .sort(
        (a, b) =>
          a.precio - b.precio
      );

    /*
     * Si no encontramos ninguna
     */

    if (resultados.length === 0) {

      result.innerHTML = `
        <div class="station">

          ❌ No hemos encontrado
          gasolineras con ese combustible
          en el código postal ${postal}.

        </div>
      `;

      return;
    }

    /*
     * Mostramos las 10 más baratas
     */

    result.innerHTML =
      resultados
        .slice(0, 10)
        .map((estacion, index) => {

          let mapa = "#";

          if (
            estacion.lat &&
            estacion.lon
          ) {

            mapa =
              "https://www.google.com/maps/search/?api=1&query=" +
              encodeURIComponent(
                estacion.lat +
                "," +
                estacion.lon
              );

          }

          return `

            <div class="station">

              <div class="price">

                ${
                  index === 0
                    ? "🥇 "
                    : ""
                }

                ${estacion.precio.toFixed(3)}
                €/L

              </div>

              <div class="name">

                ${estacion.nombre}

              </div>

              <div class="info">

                📍 ${estacion.direccion}

              </div>

              <div class="info">

                ${estacion.localidad}

              </div>

              ${
                mapa !== "#"
                  ? `
                    <a
                      class="map"
                      href="${mapa}"
                      target="_blank"
                    >
                      🗺️ Cómo llegar
                    </a>
                  `
                  : ""
              }

            </div>

          `;

        })
        .join("");

  } catch (error) {

    console.error(error);

    result.innerHTML = `

      <div class="station error">

        ❌ Ha ocurrido un error
        al obtener los precios.

        <br><br>

        Inténtalo de nuevo.

      </div>

    `;

  } finally {

    button.disabled = false;

  }

}

</script>

</body>
</html>
