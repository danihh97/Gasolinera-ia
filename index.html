<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gasolinera IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    .app {
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 18px 16px 50px;
    }

    /* CABECERA */

    .header {
      text-align: center;
      padding: 14px 0 22px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: auto;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background: #111827;
      box-shadow: 0 8px 22px rgba(17,24,39,.18);
    }

    h1 {
      margin: 12px 0 5px;
      font-size: 30px;
      letter-spacing: -0.7px;
    }

    .subtitle {
      color: #7a8496;
      font-size: 15px;
    }

    /* BUSCADOR */

    .search-card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(30,41,59,.07);
      border: 1px solid #edf0f4;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #4b5563;
    }

    select {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid #dfe3e8;
      border-radius: 13px;
      background: #fafbfc;
      color: #172033;
      font-size: 16px;
      outline: none;
    }

    select:focus {
      border-color: #111827;
    }

    .search-button {
      width: 100%;
      height: 52px;
      margin-top: 3px;
      border: 0;
      border-radius: 14px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, opacity .15s;
    }

    .search-button:active {
      transform: scale(.98);
    }

    .search-button:disabled {
      opacity: .55;
      cursor: wait;
    }

    /* RESULTADOS */

    .results {
      margin-top: 20px;
    }

    .loading {
      background: white;
      padding: 28px 20px;
      text-align: center;
      border-radius: 18px;
      color: #6b7280;
    }

    /* MEJOR PRECIO */

    .best-card {
      background: #111827;
      color: white;
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px rgba(17,24,39,.18);
    }

    .best-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .8px;
      opacity: .7;
      text-transform: uppercase;
    }

    .best-price {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-top: 6px;
    }

    .best-name {
      font-size: 18px;
      font-weight: 700;
      margin-top: 5px;
    }

    .best-location {
      margin-top: 6px;
      font-size: 14px;
      opacity: .7;
    }

    .saving {
      margin-top: 17px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.14);
      font-size: 13px;
      opacity: .85;
    }

    /* RESUMEN */

    .summary {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid #edf0f4;
    }

    .summary-main {
      font-size: 16px;
      font-weight: 700;
    }

    .summary-info {
      color: #7a8496;
      font-size: 13px;
      margin-top: 8px;
    }

    /* GASOLINERAS */

    .station {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 11px;
      border: 1px solid #edf0f4;
      box-shadow: 0 4px 16px rgba(30,41,59,.04);
    }

    .station-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .position {
      font-size: 12px;
      font-weight: 700;
      color: #8a94a6;
      margin-bottom: 5px;
    }

    .station-name {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.25;
    }

    .price {
      white-space: nowrap;
      font-size: 24px;
      font-weight: 800;
    }

    .price-unit {
      font-size: 12px;
      font-weight: 500;
      color: #8a94a6;
    }

    .station-info {
      margin-top: 9px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.4;
    }

    .map-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 9px 12px;
      border-radius: 10px;
      background: #f1f3f6;
      color: #172033;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .error {
      background: white;
      color: #b42318;
      padding: 20px;
      border-radius: 18px;
      border: 1px solid #f0d6d3;
    }

    @media (max-width: 420px) {

      h1 {
        font-size: 27px;
      }

      .best-price {
        font-size: 36px;
      }

      .station-name {
        font-size: 16px;
      }

      .price {
        font-size: 21px;
      }

    }

  </style>

</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">
      ⛽
    </div>

    <h1>
      Gasolinera IA
    </h1>

    <div class="subtitle">
      Encuentra el mejor precio para repostar
    </div>

  </div>


  <div class="search-card">

    <div class="field">

      <label for="province">
        PROVINCIA
      </label>

      <select id="province">

        <option value="01">Álava</option>
        <option value="02">Albacete</option>
        <option value="03">Alicante</option>
        <option value="04">Almería</option>
        <option value="05">Ávila</option>
        <option value="06">Badajoz</option>
        <option value="07">Baleares</option>
        <option value="08">Barcelona</option>
        <option value="09">Burgos</option>
        <option value="10">Cáceres</option>
        <option value="11">Cádiz</option>
        <option value="12">Castellón</option>
        <option value="13">Ciudad Real</option>
        <option value="14">Córdoba</option>
        <option value="15">A Coruña</option>
        <option value="16">Cuenca</option>
        <option value="17">Girona</option>
        <option value="18">Granada</option>
        <option value="19">Guadalajara</option>
        <option value="20">Guipúzcoa</option>
        <option value="21">Huelva</option>
        <option value="22">Huesca</option>
        <option value="23">Jaén</option>
        <option value="24">León</option>
        <option value="25">Lleida</option>
        <option value="26">La Rioja</option>
        <option value="27">Lugo</option>
        <option value="28">Madrid</option>
        <option value="29">Málaga</option>
        <option value="30">Murcia</option>
        <option value="31">Navarra</option>
        <option value="32">Ourense</option>
        <option value="33">Asturias</option>
        <option value="34">Palencia</option>
        <option value="35" selected>Las Palmas</option>
        <option value="36">Pontevedra</option>
        <option value="37">Salamanca</option>
        <option value="38">Santa Cruz de Tenerife</option>
        <option value="39">Cantabria</option>
        <option value="40">Segovia</option>
        <option value="41">Sevilla</option>
        <option value="42">Soria</option>
        <option value="43">Tarragona</option>
        <option value="44">Teruel</option>
        <option value="45">Toledo</option>
        <option value="46">Valencia</option>
        <option value="47">Valladolid</option>
        <option value="48">Vizcaya</option>
        <option value="49">Zamora</option>
        <option value="50">Zaragoza</option>
        <option value="51">Ceuta</option>
        <option value="52">Melilla</option>

      </select>

    </div>


    <div class="field">

      <label for="fuel">
        COMBUSTIBLE
      </label>

      <select id="fuel">

        <option value="95">
          Gasolina 95 E5
        </option>

        <option value="98">
          Gasolina 98 E5
        </option>

        <option value="diesel">
          Diésel
        </option>

      </select>

    </div>


    <button
      id="searchButton"
      class="search-button"
      onclick="buscar()"
    >
      🔎 Buscar gasolineras
    </button>

  </div>


  <div
    id="results"
    class="results"
  ></div>

</div>


<script>

async function buscar() {

  const provincia =
    document.getElementById("province").value;

  const producto =
    document.getElementById("fuel").value;

  const button =
    document.getElementById("searchButton");

  const results =
    document.getElementById("results");


  button.disabled = true;

  button.textContent =
    "⏳ Buscando...";


  results.innerHTML = `
    <div class="loading">
      Buscando los mejores precios...
    </div>
  `;


  try {

    const url =
      "/api/gasolineras" +
      "?provincia=" +
      encodeURIComponent(provincia) +
      "&producto=" +
      encodeURIComponent(producto);


    const response =
      await fetch(url);


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Error obteniendo los precios"
      );

    }


    const estaciones =
      data.estaciones || [];


    if (estaciones.length === 0) {

      results.innerHTML = `
        <div class="error">
          ❌ No encontramos gasolineras
          para esta provincia y combustible.
        </div>
      `;

      return;

    }


    const precios =
      estaciones.map(
        estacion => estacion.precio
      );


    const precioMedio =
      precios.reduce(
        (a, b) => a + b,
        0
      ) / precios.length;


    const mejor =
      estaciones[0];


    const ahorroPorLitro =
      precioMedio - mejor.precio;


    results.innerHTML = `

      <div class="best-card">

        <div class="best-label">
          🏆 Mejor precio encontrado
        </div>

        <div class="best-price">
          ${mejor.precio.toFixed(3)} €/L
        </div>

        <div class="best-name">
          ${escapeHtml(mejor.nombre)}
        </div>

        <div class="best-location">
          📍 ${escapeHtml(mejor.localidad)}
        </div>

        <div class="saving">

          ${
            ahorroPorLitro > 0
              ? `Está ${ahorroPorLitro.toFixed(3)}
                 €/L por debajo del precio medio`
              : `Es el precio más bajo encontrado`
          }

        </div>

      </div>


      <div class="summary">

        <div class="summary-main">

          ⛽ ${estaciones.length}
          gasolineras encontradas

        </div>

        <div class="summary-info">

          Precio medio:
          ${precioMedio.toFixed(3)} €/L

          <br>

          🕐 Actualizado:
          ${data.fecha || "No disponible"}

        </div>

      </div>

    `;


    estaciones.forEach(
      (estacion, index) => {

        let mapa = "#";


        if (
          estacion.latitud &&
          estacion.longitud
        ) {

          mapa =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(
              estacion.latitud +
              "," +
              estacion.longitud
            );

        }


        let posicion;


        if (index === 0) {

          posicion =
            "🥇 MÁS BARATA";

        } else if (index === 1) {

          posicion =
            "🥈 SEGUNDA MÁS BARATA";

        } else if (index === 2) {

          posicion =
            "🥉 TERCERA MÁS BARATA";

        } else {

          posicion =
            "#" + (index + 1);

        }


        results.innerHTML += `

          <div class="station">

            <div class="station-top">

              <div>

                <div class="position">
                  ${posicion}
                </div>

                <div class="station-name">

                  ${escapeHtml(
                    estacion.nombre
                  )}

                </div>

              </div>


              <div class="price">

                ${estacion.precio.toFixed(3)}

                <span class="price-unit">
                  €/L
                </span>

              </div>

            </div>


            <div class="station-info">

              📍 ${escapeHtml(
                estacion.direccion
              )}

              <br>

              ${escapeHtml(
                estacion.localidad
              )}

            </div>


            ${
              mapa !== "#"
                ? `
                  <a
                    class="map-button"
                    href="${mapa}"
                    target="_blank"
                  >
                    🗺️ Cómo llegar
                  </a>
                `
                : ""
            }

          </div>

        `;

      }
    );


  } catch (error) {

    console.error(error);


    results.innerHTML = `

      <div class="error">

        ❌ No se ha podido realizar
        la búsqueda.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  } finally {

    button.disabled = false;

    button.textContent =
      "🔎 Buscar gasolineras";

  }

}


function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
