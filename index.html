<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gasolinera IA</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111;
    }

    .app {
      max-width: 650px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .search-card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 14px;
      border-radius: 11px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      border: 0;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .results {
      margin-top: 20px;
    }

    .summary {
      background: white;
      padding: 15px;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .station {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .position {
      font-size: 14px;
      color: #777;
      margin-bottom: 5px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
    }

    .name {
      font-size: 19px;
      font-weight: bold;
      margin-top: 7px;
    }

    .info {
      color: #666;
      margin-top: 6px;
    }

    .map {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 13px;
      background: #eee;
      color: #111;
      text-decoration: none;
      border-radius: 9px;
    }

    .loading {
      text-align: center;
      padding: 25px;
      background: white;
      border-radius: 15px;
    }

    .error {
      background: white;
      padding: 20px;
      border-radius: 15px;
      color: #b00020;
    }

  </style>

</head>

<body>

<div class="app">

  <h1>⛽ Gasolinera IA</h1>

  <div class="subtitle">
    Encuentra el combustible más barato
  </div>

  <div class="search-card">

    <label for="province">
      Provincia
    </label>

    <select id="province">

      <option value="3505">
        Las Palmas
      </option>

    </select>

    <label for="postal">
      Código postal
    </label>

    <input
      id="postal"
      type="text"
      inputmode="numeric"
      maxlength="5"
      placeholder="Ejemplo: 35010"
    >

    <label for="fuel">
      Combustible
    </label>

    <select id="fuel">

      <option value="1">
        Gasolina 95 E5
      </option>

      <option value="2">
        Gasolina 98 E5
      </option>

      <option value="3">
        Diésel
      </option>

    </select>

    <button
      id="searchButton"
      onclick="buscar()"
    >
      🔎 Buscar gasolinera
    </button>

  </div>

  <div
    id="results"
    class="results"
  ></div>

</div>

<script>

async function buscar() {

  const provincia =
    document.getElementById("province").value;

  const postal =
    document.getElementById("postal").value.trim();

  const producto =
    document.getElementById("fuel").value;

  const button =
    document.getElementById("searchButton");

  const results =
    document.getElementById("results");

  if (!/^\d{5}$/.test(postal)) {

    results.innerHTML = `
      <div class="error">
        ⚠️ Introduce un código postal válido.
      </div>
    `;

    return;
  }

  button.disabled = true;

  results.innerHTML = `
    <div class="loading">
      ⏳ Buscando las gasolineras más baratas...
    </div>
  `;

  try {

    const url =
      "/api/gasolineras" +
      "?provincia=" +
      encodeURIComponent(provincia) +
      "&producto=" +
      encodeURIComponent(producto) +
      "&cp=" +
      encodeURIComponent(postal);

    const response =
      await fetch(url);

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Error en la búsqueda"
      );
    }

    const estaciones =
      data.estaciones || [];

    if (estaciones.length === 0) {

      results.innerHTML = `
        <div class="error">

          ❌ No encontramos gasolineras
          para ese código postal.

          <br><br>

          Prueba con otro código postal.

        </div>
      `;

      return;
    }

    results.innerHTML = `

      <div class="summary">

        ⛽ <strong>
          ${estaciones.length}
          gasolineras encontradas
        </strong>

        <br>

        🥇 Ordenadas de más barata
        a más cara

      </div>

    `;

    estaciones.forEach(
      (estacion, index) => {

        let mapa = "#";

        if (
          estacion.latitud &&
          estacion.longitud
        ) {

          mapa =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(
              estacion.latitud +
              "," +
              estacion.longitud
            );

        }

        results.innerHTML += `

          <div class="station">

            <div class="position">

              ${
                index === 0
                  ? "🥇 MÁS BARATA"
                  : "#" + (index + 1)
              }

            </div>

            <div class="price">

              ${estacion.precio.toFixed(3)}
              €/L

            </div>

            <div class="name">

              ${escapeHtml(
                estacion.nombre
              )}

            </div>

            <div class="info">

              📍 ${escapeHtml(
                estacion.direccion
              )}

            </div>

            <div class="info">

              ${escapeHtml(
                estacion.codigoPostal
              )}

              ${escapeHtml(
                estacion.localidad
                  ? " · " +
                    estacion.localidad
                  : ""
              )}

            </div>

            ${
              mapa !== "#"
                ? `
                  <a
                    class="map"
                    href="${mapa}"
                    target="_blank"
                  >
                    🗺️ Cómo llegar
                  </a>
                `
                : ""
            }

          </div>

        `;

      }
    );

  } catch (error) {

    console.error(error);

    results.innerHTML = `

      <div class="error">

        ❌ No se ha podido realizar
        la búsqueda.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  } finally {

    button.disabled = false;

  }

}


/*
 * Evita que datos externos puedan
 * interpretar HTML dentro de la página.
 */

function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
