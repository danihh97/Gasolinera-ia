<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AhorraFuel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
      color: #172033;
      background:
        radial-gradient(circle at 50% -10%, #dfffc0 0%, transparent 38%),
        linear-gradient(180deg, #f7faf5 0%, #eef2f4 100%);
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 18px 15px 60px;
    }

    /* LOGO */

    .brand {
      text-align: center;
      margin-bottom: 18px;
    }

    .brand-logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      display: block;
      margin: 0 auto 5px;
      filter: drop-shadow(0 8px 15px rgba(0,0,0,.12));
    }

    .tagline {
      font-size: 14px;
      font-weight: 700;
      color: #687385;
      letter-spacing: .5px;
    }

    /* BUSCADOR */

    .search-card {
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 24px;
      padding: 21px;
      box-shadow: 0 12px 35px rgba(23,32,51,.08);
      backdrop-filter: blur(10px);
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 800;
      color: #667085;
      letter-spacing: .7px;
    }

    select {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      border: 1px solid #dce2e7;
      border-radius: 14px;
      background: #f9fafb;
      color: #172033;
      font-size: 16px;
      outline: none;
    }

    select:focus {
      border-color: #63c51d;
      box-shadow: 0 0 0 3px rgba(99,197,29,.12);
    }

    .search-button {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #73d51d, #31a83d);
      color: white;
      font-size: 16px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(49,168,61,.22);
      cursor: pointer;
    }

    .search-button:active {
      transform: scale(.985);
    }

    .search-button:disabled {
      opacity: .6;
    }

    /* UBICACIÓN */

    .location-button {
      width: 100%;
      height: 50px;
      margin-top: 10px;
      border: 1px solid #dce2e7;
      border-radius: 14px;
      background: #f5f8f3;
      color: #287c2e;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .location-button:active {
      transform: scale(.985);
    }

    .location-button:disabled {
      opacity: .6;
    }

    .location-status {
      margin-top: 10px;
      text-align: center;
      color: #687385;
      font-size: 13px;
    }

    /* RESULTADOS */

    .results {
      margin-top: 20px;
    }

    .loading {
      background: white;
      border-radius: 18px;
      padding: 28px;
      text-align: center;
      color: #697386;
      box-shadow: 0 6px 20px rgba(23,32,51,.05);
    }

    /* TARJETA DESTACADA */

    .best-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #10251a, #163d22);
      color: white;
      border-radius: 23px;
      padding: 22px;
      margin-bottom: 14px;
      box-shadow: 0 12px 30px rgba(16,37,26,.18);
    }

    .best-card::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -55px;
      top: -55px;
      border-radius: 50%;
      background: rgba(116,229,29,.16);
    }

    .best-label {
      position: relative;
      z-index: 1;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .8px;
      color: #a9e979;
      text-transform: uppercase;
    }

    .best-price {
      position: relative;
      z-index: 1;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-top: 5px;
    }

    .best-name {
      position: relative;
      z-index: 1;
      font-size: 18px;
      font-weight: 800;
      margin-top: 4px;
    }

    .best-location {
      position: relative;
      z-index: 1;
      margin-top: 6px;
      font-size: 14px;
      color: #c7d5cb;
    }

    .best-distance {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #a9e979;
    }

    .saving {
      position: relative;
      z-index: 1;
      margin-top: 16px;
      padding-top: 13px;
      border-top: 1px solid rgba(255,255,255,.13);
      font-size: 13px;
      color: #d8eadb;
    }

    /* RESUMEN */

    .summary {
      background: rgba(255,255,255,.94);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 5px 18px rgba(23,32,51,.05);
    }

    .summary-main {
      font-size: 16px;
      font-weight: 800;
    }

    .summary-info {
      margin-top: 8px;
      color: #788294;
      font-size: 13px;
      line-height: 1.6;
    }

    /* GASOLINERAS */

    .station {
      background: rgba(255,255,255,.96);
      border: 1px solid #edf0f2;
      border-radius: 19px;
      padding: 18px;
      margin-bottom: 11px;
      box-shadow: 0 5px 18px rgba(23,32,51,.045);
    }

    .station-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .position {
      color: #8993a3;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .station-name {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.25;
    }

    .price {
      white-space: nowrap;
      font-size: 24px;
      font-weight: 900;
    }

    .price-unit {
      font-size: 11px;
      color: #8993a3;
      font-weight: 600;
    }

    .price-wrap {
      text-align: right;
    }

    .price.good {
      color: #2f9e44;
    }

    .price.medium {
      color: #d99a00;
    }

    .price.bad {
      color: #d64545;
    }

    .price-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .2px;
      white-space: nowrap;
    }

    .price-badge.good {
      background: #e8f7df;
      color: #287c2e;
    }

    .price-badge.bad {
      background: #fff0f0;
      color: #c62828;
    }

    .price-badge.medium {
      background: #fff7db;
      color: #9a6b00;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .option-card {
      background: rgba(255,255,255,.96);
      border: 1px solid #edf0f2;
      border-radius: 17px;
      padding: 14px;
      box-shadow: 0 5px 18px rgba(23,32,51,.045);
    }

    .option-label {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .4px;
      color: #687385;
      text-transform: uppercase;
    }

    .option-price {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 900;
    }

    .option-name {
      margin-top: 5px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.25;
    }

    .option-distance {
      margin-top: 5px;
      font-size: 11px;
      color: #287c2e;
      font-weight: 800;
    }

    @media (max-width: 520px) {
      .option-grid {
        grid-template-columns: 1fr;
      }
    }

    .station-info {
      margin-top: 9px;
      color: #707b8d;
      font-size: 13px;
      line-height: 1.5;
    }

    .distance {
      margin-top: 8px;
      color: #287c2e;
      font-size: 13px;
      font-weight: 800;
    }

    .map-button {
      display: inline-block;
      margin-top: 14px;
      padding: 9px 13px;
      border-radius: 10px;
      background: #eef8e9;
      color: #287c2e;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }

    .error {
      background: white;
      color: #b42318;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(23,32,51,.05);
    }

    @media (max-width: 420px) {

      .brand-logo {
        width: 130px;
        height: 130px;
      }

      .best-price {
        font-size: 36px;
      }

      .station-name {
        font-size: 16px;
      }

      .price {
        font-size: 21px;
      }
    }
  </style>

</head>

      </label>

        </option>

    </div>


    <button
      id="searchButton"

<script>

let ubicacionUsuario = null;


/* =========================
   OBTENER UBICACIÓN
========================= */

function usarUbicacion() {

  const button =
    document.getElementById("locationButton");

  const status =
    document.getElementById("locationStatus");


  if (!navigator.geolocation) {

    status.textContent =
      "❌ Tu dispositivo no permite obtener la ubicación.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "📍 Obteniendo ubicación...";

  status.textContent =
    "Permite el acceso a tu ubicación.";


  navigator.geolocation.getCurrentPosition(

    function(position) {

      ubicacionUsuario = {

        lat:
          position.coords.latitude,

        lon:
          position.coords.longitude

      };


      button.disabled = false;

      button.textContent =
        "✅ Ubicación activada";


      status.textContent =
        "Ubicación obtenida. Buscando gasolineras...";

      // Buscar automáticamente al obtener la ubicación.
      buscar();

    },


    function(error) {

      console.error(error);

      ubicacionUsuario = null;

      button.disabled = false;

      button.textContent =
        "📍 Cerca de mí";


      status.textContent =
        "❌ No se pudo obtener tu ubicación.";

    },

    {

      enableHighAccuracy: true,

      timeout: 10000,

      maximumAge: 60000

    }

  );

}


/* =========================
   BUSCAR GASOLINERAS
========================= */

async function buscar() {

  const provincia =
    document.getElementById("province").value;

  const producto =
    document.getElementById("fuel").value;

  const button =
    document.getElementById("searchButton");

  const results =
    document.getElementById("results");


  button.disabled = true;

  button.textContent =
    "⏳ Buscando...";


  results.innerHTML = `

    <div class="loading">

      Buscando los mejores precios...

    </div>

  `;


  try {

    const url =
      "/api/gasolineras" +
      "?provincia=" +
      encodeURIComponent(provincia) +
      "&producto=" +
      encodeURIComponent(producto);


    const response =
      await fetch(url);


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(

        data.error ||
        "Error obteniendo los precios"

      );

    }


    let estaciones =
      data.estaciones || [];


    if (estaciones.length === 0) {

      results.innerHTML = `

        <div class="error">

          ❌ No encontramos gasolineras
          para esta provincia y combustible.

        </div>

      `;

      return;

    }


    /* =========================
       CALCULAR DISTANCIAS
    ========================= */

    if (ubicacionUsuario) {

      estaciones =
        estaciones.map(
          estacion => {

            const lat =
              parseFloat(
                String(
                  estacion.latitud || ""
                )
                .replace(",", ".")
              );


            const lon =
              parseFloat(
                String(
                  estacion.longitud || ""
                )
                .replace(",", ".")
              );


            if (
              isNaN(lat) ||
              isNaN(lon)
            ) {

              return {

                ...estacion,

                distancia: null

              };

            }


            return {

              ...estacion,

              distancia:
                calcularDistancia(
                  ubicacionUsuario.lat,
                  ubicacionUsuario.lon,
                  lat,
                  lon
                )

            };

          }
        );


      /* Ordenar por distancia */

      estaciones.sort(
        (a, b) => {

          if (
            a.distancia === null
          ) return 1;

          if (
            b.distancia === null
          ) return -1;

          return (
            a.distancia -
            b.distancia
          );

        }
      );

    } else {

      /* Ordenar por precio */

      estaciones.sort(
        (a, b) =>
          a.precio - b.precio
      );

    }


    /* =========================
       PRECIO MEDIO
    ========================= */

    const precios =
      estaciones
        .map(
          estacion =>
            estacion.precio
        )
        .filter(
          precio =>
            typeof precio === "number"
        );


    const precioMedio =
      precios.reduce(
        (a, b) => a + b,
        0
      ) / precios.length;


    /* =========================
       RANKING PRECIO + DISTANCIA
    ========================= */

    const estacionesConPrecio =
      estaciones.filter(
        estacion =>
          typeof estacion.precio === "number"
      );

    const mejorPrecio =
      [...estacionesConPrecio]
        .sort(
          (a, b) =>
            a.precio - b.precio
        )[0];

    const masCercana =
      ubicacionUsuario
        ? [...estaciones]
            .filter(
              estacion =>
                estacion.distancia !== null &&
                typeof estacion.distancia === "number"
            )
            .sort(
              (a, b) =>
                a.distancia - b.distancia
            )[0]
        : null;

    /*
      "Más barata cerca" se mantiene como cálculo interno para la
      mejor opción; la tarjeta pública muestra la más barata de todas.
    */

    const diezMasCercanas =
      ubicacionUsuario
        ? [...estaciones]
            .filter(
              estacion =>
                estacion.distancia !== null &&
                typeof estacion.distancia === "number" &&
                typeof estacion.precio === "number"
            )
            .sort(
              (a, b) =>
                a.distancia - b.distancia
            )
            .slice(0, 10)
        : [];

    const masBarataCerca =
      diezMasCercanas.length
        ? [...diezMasCercanas]
            .sort(
              (a, b) =>
                a.precio - b.precio
            )[0]
        : mejorPrecio;

    const ahorroPorLitro =
      precioMedio -
      mejorPrecio.precio;


    /* =========================
       TARJETAS SUPERIORES
    ========================= */

    if (
      ubicacionUsuario &&
      masCercana
    ) {

      results.innerHTML = `

        <div class="option-grid">

          <div class="option-card">

            <div class="option-label">
              💰 MÁS BARATA
            </div>

            <div class="option-price">
              ${mejorPrecio.precio.toFixed(3)} €/L
            </div>

            <div class="option-name">
              ${escapeHtml(mejorPrecio.nombre)}
            </div>

            <div class="option-distance">
              ${
                mejorPrecio.distancia !== null
                  ? `🚗 ${formatearDistancia(mejorPrecio.distancia)}`
                  : ""
              }
            </div>

          </div>


          <div class="option-card">

            <div class="option-label">
              📍 MÁS CERCANA
            </div>

            <div class="option-price">
              ${masCercana.precio.toFixed(3)} €/L
            </div>

            <div class="option-name">
              ${escapeHtml(masCercana.nombre)}
            </div>

            <div class="option-distance">
              🚗 ${formatearDistancia(masCercana.distancia)}
            </div>

          </div>

        </div>

      `;

    } else {

      results.innerHTML = `

        <div class="best-card">

          <div class="best-label">
            🏆 MEJOR PRECIO
          </div>

          <div class="best-price">
            ${mejorPrecio.precio.toFixed(3)} €/L
          </div>

          <div class="best-name">
            ${escapeHtml(mejorPrecio.nombre)}
          </div>

          <div class="best-location">
            📍 ${escapeHtml(mejorPrecio.localidad)}
          </div>

          <div class="saving">

            ${
              ahorroPorLitro > 0
                ? `Está ${ahorroPorLitro.toFixed(3)} €/L por debajo del precio medio.`
                : `Es el precio más bajo encontrado.`
            }

          </div>

        </div>

      `;

    }


    /* =========================
       RESUMEN
    ========================= */

    results.innerHTML += `

      <div class="summary">

        <div class="summary-main">

          ⛽ ${
            estaciones.length
          }
          gasolineras encontradas

        </div>


        <div class="summary-info">

          Precio medio:
          ${
            precioMedio.toFixed(3)
          } €/L

          <br>

          🕐 Actualizado:
          ${
            data.fecha ||
            "No disponible"
          }

          <br>

          ${
            ubicacionUsuario

              ?

              "📍 Ordenadas por cercanía"

              :

              "💰 Ordenadas por precio"

          }

        </div>

      </div>

    `;


    /* =========================
       LISTA DE GASOLINERAS
    ========================= */

    /*
      Colores de precio:
      25% más baratos = verde
      50% intermedios = amarillo
      25% más caros = rojo
    */

    const preciosOrdenados =
      [...estacionesConPrecio]
        .map(estacion => estacion.precio)
        .sort((a, b) => a - b);

    const indiceVerde =
      Math.max(
        0,
        Math.ceil(preciosOrdenados.length * 0.25) - 1
      );

    const indiceRojo =
      Math.min(
        preciosOrdenados.length - 1,
        Math.floor(preciosOrdenados.length * 0.75)
      );

    const umbralVerde =
      preciosOrdenados.length
        ? preciosOrdenados[indiceVerde]
        : null;

    const umbralRojo =
      preciosOrdenados.length
        ? preciosOrdenados[indiceRojo]
        : null;


    estaciones.forEach(
      (estacion, index) => {

        let mapa = "#";


        if (

          estacion.latitud &&
          estacion.longitud

        ) {

          const latMapa =
            String(
              estacion.latitud
            )
            .replace(",", ".");


          const lonMapa =
            String(
              estacion.longitud
            )
            .replace(",", ".");


          mapa =
            "https://www.google.com/maps/search/?api=1&query=" +

            encodeURIComponent(

              latMapa +
              "," +
              lonMapa

            );

        }


        let posicion;

        if (ubicacionUsuario) {

          posicion =
            index === 0
              ? "📍 MÁS CERCANA"
              : "#" + (index + 1);

        } else {

          if (index === 0) {

            posicion = "🥇 MÁS BARATA";

          } else if (index === 1) {

            posicion = "🥈 SEGUNDA MÁS BARATA";

          } else if (index === 2) {

            posicion = "🥉 TERCERA MÁS BARATA";

          } else {

            posicion = "#" + (index + 1);

          }

        }


        results.innerHTML += `

          <div class="station">

            <div class="station-top">

              <div>

                <div class="position">

                  ${posicion}

                </div>


                <div class="station-name">

                  ${
                    escapeHtml(
                      estacion.nombre
                    )
                  }

                </div>

              </div>


              <div class="price-wrap">

                <div class="price ${
                  umbralVerde !== null &&
                  estacion.precio <= umbralVerde
                    ? "good"
                    : (
                      umbralRojo !== null &&
                      estacion.precio >= umbralRojo
                        ? "bad"
                        : "medium"
                    )
                }">

                  ${
                    estacion.precio.toFixed(3)
                  }

                  <span class="price-unit">

                    €/L

                  </span>

                </div>

                <div>

                  ${
                    mejorPrecio &&
                    estacion.precio === mejorPrecio.precio
                      ?
                      `
                        <span class="price-badge good">
                          💰 MÁS BARATA
                        </span>
                      `
                      :
                      ""
                  }

                  ${
                    preciosOrdenados.length > 1 &&
                    estacion.precio === preciosOrdenados[preciosOrdenados.length - 1]
                      ?
                      `
                        <span class="price-badge bad">
                          💸 MÁS CARA
                        </span>
                      `
                      :
                      ""
                  }

                </div>

              </div>

            </div>


            <div class="station-info">

              📍 ${
                escapeHtml(
                  estacion.direccion
                )
              }

              <br>

              ${
                escapeHtml(
                  estacion.localidad
                )
              }

            </div>


            ${
              ubicacionUsuario &&
              estacion.distancia !== null

              ?

              `

                <div class="distance">

                  🚗 ${
                    formatearDistancia(
                      estacion.distancia
                    )
                  }

                </div>

              `

              :

              ""

            }


            ${
              mapa !== "#"

              ?

              `

                <a

                  class="map-button"

                  href="${mapa}"

                  target="_blank"

                  rel="noopener noreferrer"

                >

                  🗺️ Cómo llegar

                </a>

              `

              :

              ""

            }

          </div>

        `;

      }

    );


  } catch (error) {

    console.error(error);


    results.innerHTML = `

      <div class="error">

        ❌ No se ha podido realizar
        la búsqueda.

        <br><br>

        ${
          escapeHtml(
            error.message
          )
        }

      </div>

    `;

  } finally {

    button.disabled = false;

    button.textContent =
      "🔎 Buscar gasolineras";

  }

}


/* =========================
   DISTANCIA
========================= */

function calcularDistancia(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R = 6371;


  const dLat =
    gradosARadianes(
      lat2 - lat1
    );


  const dLon =
    gradosARadianes(
      lon2 - lon1
    );


  const a =

    Math.sin(dLat / 2) *
    Math.sin(dLat / 2)

    +

    Math.cos(
      gradosARadianes(lat1)
    )

    *

    Math.cos(
      gradosARadianes(lat2)
    )

    *

    Math.sin(dLon / 2) *
    Math.sin(dLon / 2);


  const c =
    2 *

    Math.atan2(

      Math.sqrt(a),

      Math.sqrt(1 - a)

    );


  return R * c;

}


function gradosARadianes(
  grados
) {

  return grados *
    Math.PI /
    180;

}


/* =========================
   DISTANCIA BONITA
========================= */

function formatearDistancia(
  distancia
) {

  if (
    distancia < 1
  ) {

    return (

      Math.round(
        distancia * 1000
      )

      +

      " m"

    );

  }


  return (

    distancia.toFixed(1)

    +

    " km"

  );

}


/* =========================
   SEGURIDAD
========================= */

function escapeHtml(
  text
) {

  return String(
    text || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
