<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gasolinera IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .app {
      max-width: 650px;
      margin: auto;
      padding: 20px 15px 50px;
    }

    .logo {
      text-align: center;
      font-size: 38px;
      margin-top: 10px;
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 22px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 7px;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      border: 0;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .results {
      margin-top: 20px;
    }

    .best {
      background: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      text-align: center;
    }

    .best-title {
      font-size: 15px;
      font-weight: bold;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .best-price {
      font-size: 38px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .best-name {
      font-size: 18px;
      font-weight: bold;
    }

    .saving {
      margin-top: 10px;
      font-size: 14px;
      color: #166534;
    }

    .summary {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 12px;
    }

    .station {
      background: white;
      padding: 18px;
      border-radius: 17px;
      margin-bottom: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .position {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .price {
      font-size: 27px;
      font-weight: bold;
    }

    .name {
      font-size: 18px;
      font-weight: bold;
      margin-top: 7px;
    }

    .info {
      color: #6b7280;
      margin-top: 6px;
    }

    .map {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 14px;
      background: #f3f4f6;
      color: #111827;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      padding: 25px;
      background: white;
      border-radius: 15px;
    }

    .error {
      background: white;
      padding: 20px;
      border-radius: 15px;
      color: #b91c1c;
    }
  </style>

</head>

<body>

<div class="app">

  <div class="logo">⛽</div>

  <h1>Gasolinera IA</h1>

  <div class="subtitle">
    Encuentra dónde repostar más barato
  </div>

  <div class="card">

    <label for="province">
      📍 Provincia
    </label>

    <select id="province">

      <option value="01">Álava</option>
      <option value="02">Albacete</option>
      <option value="03">Alicante</option>
      <option value="04">Almería</option>
      <option value="05">Ávila</option>
      <option value="06">Badajoz</option>
      <option value="07">Baleares</option>
      <option value="08">Barcelona</option>
      <option value="09">Burgos</option>
      <option value="10">Cáceres</option>
      <option value="11">Cádiz</option>
      <option value="12">Castellón</option>
      <option value="13">Ciudad Real</option>
      <option value="14">Córdoba</option>
      <option value="15">A Coruña</option>
      <option value="16">Cuenca</option>
      <option value="17">Girona</option>
      <option value="18">Granada</option>
      <option value="19">Guadalajara</option>
      <option value="20">Guipúzcoa</option>
      <option value="21">Huelva</option>
      <option value="22">Huesca</option>
      <option value="23">Jaén</option>
      <option value="24">León</option>
      <option value="25">Lleida</option>
      <option value="26">La Rioja</option>
      <option value="27">Lugo</option>
      <option value="28">Madrid</option>
      <option value="29">Málaga</option>
      <option value="30">Murcia</option>
      <option value="31">Navarra</option>
      <option value="32">Ourense</option>
      <option value="33">Asturias</option>
      <option value="34">Palencia</option>
      <option value="35" selected>Las Palmas</option>
      <option value="36">Pontevedra</option>
      <option value="37">Salamanca</option>
      <option value="38">Santa Cruz de Tenerife</option>
      <option value="39">Cantabria</option>
      <option value="40">Segovia</option>
      <option value="41">Sevilla</option>
      <option value="42">Soria</option>
      <option value="43">Tarragona</option>
      <option value="44">Teruel</option>
      <option value="45">Toledo</option>
      <option value="46">Valencia</option>
      <option value="47">Valladolid</option>
      <option value="48">Vizcaya</option>
      <option value="49">Zamora</option>
      <option value="50">Zaragoza</option>
      <option value="51">Ceuta</option>
      <option value="52">Melilla</option>

    </select>

    <label for="fuel">
      ⛽ Combustible
    </label>

    <select id="fuel">

      <option value="95">
        Gasolina 95 E5
      </option>

      <option value="98">
        Gasolina 98 E5
      </option>

      <option value="diesel">
        Diésel
      </option>

    </select>

    <button
      id="searchButton"
      onclick="buscar()"
    >
      🔎 Buscar gasolineras
    </button>

  </div>

  <div
    id="results"
    class="results"
  ></div>

</div>

<script>

async function buscar() {

  const provincia =
    document.getElementById("province").value;

  const producto =
    document.getElementById("fuel").value;

  const button =
    document.getElementById("searchButton");

  const results =
    document.getElementById("results");

  button.disabled = true;

  results.innerHTML = `
    <div class="loading">
      ⏳ Buscando precios...
    </div>
  `;

  try {

    const url =
      "/api/gasolineras" +
      "?provincia=" +
      encodeURIComponent(provincia) +
      "&producto=" +
      encodeURIComponent(producto);

    const response =
      await fetch(url);

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Error obteniendo los precios"
      );
    }

    const estaciones =
      data.estaciones || [];

    if (estaciones.length === 0) {

      results.innerHTML = `
        <div class="error">
          ❌ No se encontraron gasolineras
          para esta provincia y combustible.
        </div>
      `;

      return;
    }

    const precios =
      estaciones.map(e => e.precio);

    const precioMedio =
      precios.reduce(
        (a, b) => a + b,
        0
      ) / precios.length;

    const mejor =
      estaciones[0];

    const ahorroPorLitro =
      precioMedio - mejor.precio;

    results.innerHTML = `

      <div class="best">

        <div class="best-title">
          🏆 MEJOR PRECIO
        </div>

        <div class="best-price">
          ${mejor.precio.toFixed(3)} €/L
        </div>

        <div class="best-name">
          ${escapeHtml(mejor.nombre)}
        </div>

        <div class="info">
          📍 ${escapeHtml(mejor.localidad)}
        </div>

        <div class="saving">
          ${ahorroPorLitro > 0
            ? `Está ${ahorroPorLitro.toFixed(3)} €/L
               por debajo de la media`
            : `Es el precio más bajo encontrado`
          }
        </div>

      </div>

      <div class="summary">

        ⛽ <strong>
          ${estaciones.length}
          gasolineras encontradas
        </strong>

        <br><br>

        📊 Precio medio:
        <strong>
          ${precioMedio.toFixed(3)} €/L
        </strong>

        <br><br>

        🕐 Actualizado:
        ${data.fecha || "No disponible"}

      </div>

    `;

    estaciones.forEach(
      (estacion, index) => {

        let mapa = "#";

        if (
          estacion.latitud &&
          estacion.longitud
        ) {

          mapa =
            "https://www.google.com/maps/search/?api=1&query=" +
            encodeURIComponent(
              estacion.latitud +
              "," +
              estacion.longitud
            );
        }

        results.innerHTML += `

          <div class="station">

            <div class="position">

              ${
                index === 0
                  ? "🥇 MÁS BARATA"
                  : index === 1
                    ? "🥈 SEGUNDA MÁS BARATA"
                    : index === 2
                      ? "🥉 TERCERA MÁS BARATA"
                      : "#" + (index + 1)
              }

            </div>

            <div class="price">
              ${estacion.precio.toFixed(3)} €/L
            </div>

            <div class="name">
              ${escapeHtml(estacion.nombre)}
            </div>

            <div class="info">
              📍 ${escapeHtml(estacion.direccion)}
            </div>

            <div class="info">
              ${escapeHtml(estacion.localidad)}
            </div>

            ${
              mapa !== "#"
                ? `
                  <a
                    class="map"
                    href="${mapa}"
                    target="_blank"
                  >
                    🗺️ Cómo llegar
                  </a>
                `
                : ""
            }

          </div>

        `;
      }
    );

  } catch (error) {

    console.error(error);

    results.innerHTML = `

      <div class="error">

        ❌ No se ha podido realizar
        la búsqueda.

        <br><br>

        ${escapeHtml(error.message)}

      </div>

    `;

  } finally {

    button.disabled = false;
  }
}

function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>

</html>
