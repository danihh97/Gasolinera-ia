<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gasolinera IA</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      background: #111;
      color: white;
      border: none;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    .result {
      margin-top: 25px;
    }

    .station {
      background: white;
      padding: 18px;
      margin-top: 12px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .price {
      font-size: 25px;
      font-weight: bold;
    }

    .name {
      font-size: 18px;
      font-weight: bold;
      margin-top: 6px;
    }

    .info {
      color: #666;
      margin-top: 6px;
    }

    .map {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
      background: #eee;
      color: #222;
      padding: 9px 12px;
      border-radius: 8px;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>⛽ Gasolinera IA</h1>

  <p class="subtitle">
    Encuentra el combustible más barato cerca de ti
  </p>

  <div class="card">

    <label for="postal">Código postal</label>

    <input
      id="postal"
      type="text"
      placeholder="Ejemplo: 35010"
      maxlength="5"
    >

    <label for="fuel">Combustible</label>

    <select id="fuel">
      <option value="95">Gasolina 95</option>
      <option value="98">Gasolina 98</option>
      <option value="diesel">Diésel</option>
    </select>

    <label for="radius">Radio</label>

    <select id="radius">
      <option value="5">5 km</option>
      <option value="10">10 km</option>
      <option value="20">20 km</option>
    </select>

    <button id="searchButton" onclick="buscar()">
      🔎 Buscar gasolina barata
    </button>

  </div>

  <div id="result" class="result"></div>

</div>

<script>

async function buscar() {

  const postal = document.getElementById("postal").value.trim();
  const fuel = document.getElementById("fuel").value;
  const button = document.getElementById("searchButton");
  const result = document.getElementById("result");

  if (!/^\d{5}$/.test(postal)) {
    result.innerHTML =
      "<div class='station'>⚠️ Introduce un código postal válido.</div>";
    return;
  }

  button.disabled = true;

  result.innerHTML =
    "<div class='loading'>⏳ Buscando las gasolineras más baratas...</div>";

  try {

    const response = await fetch("/api/gasolineras");

    if (!response.ok) {
      throw new Error("Error obteniendo los datos");
    }

    const estaciones = await response.json();

    let campoPrecio;

    if (fuel === "95") {
      campoPrecio = "Precio_x0020_Gasolina_x0020_95_x0020_E5";
    }

    if (fuel === "98") {
      campoPrecio = "Precio_x0020_Gasolina_x0020_98_x0020_E5";
    }

    if (fuel === "diesel") {
      campoPrecio = "Precio_x0020_Gasoleo_x0020_A";
    }

    const resultados = estaciones
      .filter(estacion => {
        return estacion["C.P."] === postal;
      })
      .map(estacion => {

        const precioTexto = estacion[campoPrecio];

        if (!precioTexto) return null;

        const precio = parseFloat(
          precioTexto.replace(",", ".")
        );

        if (isNaN(precio)) return null;

        return {
          nombre: estacion["Rótulo"],
          direccion: estacion["Dirección"],
          localidad: estacion["Localidad"],
          precio: precio,
          lat: estacion["Latitud"],
          lon: estacion["Longitud_x0020__x0028_WGS84_x0029_"]
        };

      })
      .filter(Boolean)
      .sort((a, b) => a.precio - b.precio);

    if (resultados.length === 0) {

      result.innerHTML =
        "<div class='station'>❌ No hemos encontrado estaciones con ese combustible en ese código postal.</div>";

      return;
    }

    result.innerHTML = resultados
      .slice(0, 10)
      .map((estacion, index) => {

        const mapa =
          "https://www.google.com/maps/search/?api=1&query=" +
          encodeURIComponent(
            estacion.lat + "," + estacion.lon
          );

        return `
          <div class="station">

            <div class="price">
              ${index === 0 ? "🥇 " : ""}
              ${estacion.precio.toFixed(3)} €/L
            </div>

            <div class="name">
              ${estacion.nombre || "Gasolinera"}
            </div>

            <div class="info">
              📍 ${estacion.direccion || ""}
            </div>

            <div class="info">
              ${estacion.localidad || ""}
            </div>

            <a class="map"
               href="${mapa}"
               target="_blank">
              🗺️ Cómo llegar
            </a>

          </div>
        `;

      })
      .join("");

  } catch (error) {

    result.innerHTML =
      "<div class='station'>❌ Ha ocurrido un error al obtener los precios. Inténtalo de nuevo.</div>";

  } finally {

    button.disabled = false;

  }

}

</script>

</body>
</html>
