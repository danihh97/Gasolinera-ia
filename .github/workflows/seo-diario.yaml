name: Actualizar páginas SEO

on:
  schedule:
    - cron: "40 5 * * *"   # cada día
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar páginas con los precios de hoy
        run: node scripts/generar-seo.mjs

      - name: Guardar cambios
        run: |
          git config user.name "AhorraFuel Bot"
          git config user.email "actions@users.noreply.github.com"
          git add gasolineras-baratas gasolineras-baratas.html precio-gasolina-hoy.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar páginas SEO"
            git pull --rebase origin main
            git push
          fi
