name: Actualizar páginas SEO

on:
  schedule:
    - cron: "40 5 * * *"   # cada día
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar páginas con los precios de hoy
        run: |
          SCRIPT=$(find . -type f -name 'generar-seo*' -not -path './.git/*' -not -path './node_modules/*' | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "No encuentro el archivo generar-seo.mjs en el repositorio."
            echo "Contenido de la carpeta scripts:"
            ls -la scripts || true
            exit 1
          fi
          echo "Usando: $SCRIPT"
          cp "$SCRIPT" "$RUNNER_TEMP/generar-seo.mjs"
          node "$RUNNER_TEMP/generar-seo.mjs"

      - name: Guardar cambios
        run: |
          git config user.name "AhorraFuel Bot"
          git config user.email "actions@users.noreply.github.com"
          git add gasolineras-baratas gasolineras-baratas.html precio-gasolina-hoy.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar páginas SEO"
            git pull --rebase origin main
            git push
          fi
