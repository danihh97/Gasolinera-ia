name: Actualizar precios AhorraFuel

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar precios
        run: |
          curl -sS --retry 3 --retry-delay 20 --max-time 120 \
            -o respuesta.json -w "HTTP %{http_code}\n" \
            -X POST -H "Authorization: Bearer ${{ secrets.ACTUALIZAR_PRECIOS_TOKEN }}" \
            https://ahorrafuel.es/api/actualizar-precios
          cat respuesta.json
          grep -q '"ok":true' respuesta.json
